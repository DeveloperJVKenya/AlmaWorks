name: almaworks
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3
  http: ^1.4.0
  cloud_firestore: ^6.0.0
  provider: ^6.1.5
  flutter_riverpod: ^2.6.1
  firebase_core: ^4.0.0
  logger: ^2.6.1
  firebase_storage: ^13.0.0
  path_provider: ^2.1.5
  dio: ^5.9.0
  path: ^1.9.1
  mime: ^2.0.0
  file_picker: ^11.0.2
  syncfusion_flutter_pdfviewer: ^33.2.3
  google_fonts: ^8.0.2
  intl: ^0.20.2
  url_launcher: ^6.3.2
  txt_docx: ^2.0.0
  signature: ^6.3.0
  docx_template: ^0.4.0
  image_picker: ^1.2.0
  google_mlkit_text_recognition: ^0.15.0
  universal_html: ^2.2.4
  share_plus: ^12.0.2
  photo_view: ^0.15.0
  image: ^4.3.0
  flutter_zoom_drawer: ^3.2.0
  cached_network_image: ^3.4.1
  flutter_inappwebview: ^6.1.5
  flutter_inappwebview_platform_interface: ^1.3.0+1
  flutter_cache_manager: ^3.4.1
  connectivity_plus: ^7.0.0
  open_file: ^4.0.0
  web: ^1.1.1
  permission_handler: ^12.0.1
  device_info_plus: ^12.4.0
  flutter_ringtone_player: ^4.0.0+4
  flutter_local_notifications: ^22.0.1
  elegant_notification: ^2.5.1
  timezone: ^0.11.0
  workmanager: ^0.9.0+3
  awesome_notifications: ^0.12.0
  firebase_auth: ^6.1.3
  firebase_messaging: ^16.1.0
  uuid: ^4.5.3
  printing: ^5.14.2
  flutter_quill: ^11.5.0
  pdf: ^3.11.3
  flutter_localizations:
    sdk: flutter
  pluto_grid: ^8.1.0
  image_cropper: ^12.2.1
  excel: ^4.0.6
  weather: ^3.2.1
  crop_your_image: ^2.0.0
  lottie: ^3.3.0
  rive: 0.13.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"

  # Configuration for the flutter_launcher_icons package
flutter_launcher_icons:
  # 1. Main configuration keys (android, ios, web, etc.)
  android: "launcher_icon" # Use a specific name
  ios: true
  
  # 2. Source image path
  image_path: "assets/icon.png"

  # 3. Web configuration (Must be a map/nested block)
  web:
    generate: true
    image_path: "assets/icon.png"
    background_color: "#FFFFFF"
    theme_color: "#000000"